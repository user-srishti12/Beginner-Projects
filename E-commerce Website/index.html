<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopSphere - a modern responsive e-commerce product catalog">
  <title>ShopSphere | E-Commerce Catalog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="#/">ShopSphere</a>
    <nav>
      <a href="#/">Home</a>
      <a href="#/products">Products</a>
      <a href="#/about">About</a>
    </nav>
    <button id="cartButton" class="cart-btn">🛒 Cart <span id="cartCount">0</span></button>
  </header>

  <main id="app" class="container"></main>

  <div class="overlay"></div>
  <aside class="cart-panel">
    <div class="section-title"><h2>Your Cart</h2><button id="cartClose">✕</button></div>
    <div id="cartItems"></div>
    <div class="section-title"><strong>Total</strong><strong id="cartTotal">₹0</strong></div>
    <button class="primary" style="width:100%" onclick="alert('Demo checkout — connect a backend/payment gateway here.')">Checkout</button>
  </aside>

  <footer>
    <p>© 2026 ShopSphere · Built as a Full-Stack Deployment & Project Architecture capstone</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
